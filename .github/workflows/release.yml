name: Release installers

on:
  push:
    tags:
      - "v*"

permissions:
  contents: read

jobs:
  version:
    name: Validate release tag
    runs-on: ubuntu-24.04
    outputs:
      display: ${{ steps.version.outputs.display }}
      windows: ${{ steps.version.outputs.windows }}
    steps:
      - name: Check out source
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache-dependency-path: go.sum

      - name: Validate and normalize version
        id: version
        shell: bash
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          if [[ ! "$RELEASE_TAG" =~ ^v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$ ]]; then
            echo "The release tag must use the canonical vMAJOR.MINOR.PATCH form." >&2
            exit 1
          fi
          mapfile -t values < <(go run ./cmd/buildversion --version "$RELEASE_TAG" --format lines)
          IFS=. read -r major minor patch <<< "${values[0]}"
          if (( major > 255 || minor > 255 || patch > 65535 )); then
            echo "The version exceeds Windows Installer limits (255.255.65535)." >&2
            exit 1
          fi
          echo "display=${values[0]}" >> "$GITHUB_OUTPUT"
          echo "windows=${values[1]}" >> "$GITHUB_OUTPUT"

  test:
    name: Test
    needs: version
    runs-on: ubuntu-24.04
    steps:
      - name: Check out source
        uses: actions/checkout@v7

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache-dependency-path: go.sum

      - name: Install Ebitengine build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install --yes \
            gcc libc6-dev libgl1-mesa-dev libxcursor-dev libxi-dev \
            libxinerama-dev libxrandr-dev libxxf86vm-dev libasound2-dev \
            pkg-config xvfb xauth

      - name: Run tests in a virtual display
        run: xvfb-run --auto-servernum go test ./...

  windows:
    name: Windows x64
    needs: [version, test]
    runs-on: windows-2025
    env:
      RELEASE_VERSION: ${{ needs.version.outputs.display }}
      WINDOWS_VERSION: ${{ needs.version.outputs.windows }}
    steps:
      - name: Check out source
        uses: actions/checkout@v7

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache-dependency-path: go.sum

      - name: Install Windows resource generator
        shell: pwsh
        run: go install github.com/josephspurrier/goversioninfo/cmd/goversioninfo@v1.7.0

      - name: Build executable and EXE installer
        shell: pwsh
        run: |
          ./scripts/build-installer.ps1 `
            -Version $env:RELEASE_VERSION `
            -OutputDir "dist/windows" `
            -InstallerOutputDir "dist/release"
          Copy-Item dist/windows/PicaGo.exe "dist/release/PicaGo-$env:RELEASE_VERSION-windows-amd64.exe"
          Copy-Item THIRD_PARTY_NOTICES.txt dist/release/THIRD_PARTY_NOTICES.txt

      - name: Install WiX Toolset
        shell: pwsh
        run: dotnet tool install wix --tool-path "$env:RUNNER_TEMP/wix" --version 6.0.2

      - name: Build MSI
        shell: pwsh
        run: |
          $msiVersion = (($env:WINDOWS_VERSION -split '\.')[0..2] -join '.')
          & "$env:RUNNER_TEMP/wix/wix.exe" build packaging/windows/PicaGo.wxs `
            -arch x64 `
            -d "Version=$msiVersion" `
            -d "SourceDir=$((Resolve-Path 'dist/windows').Path)" `
            -d "IconPath=$((Resolve-Path 'icon.ico').Path)" `
            -out "dist/release/PicaGo-$env:RELEASE_VERSION-windows-amd64.msi"

      - name: Upload Windows packages
        uses: actions/upload-artifact@v7
        with:
          name: release-windows-amd64
          path: dist/release/*
          if-no-files-found: error

  linux:
    name: Linux x64
    needs: [version, test]
    runs-on: ubuntu-24.04
    env:
      RELEASE_VERSION: ${{ needs.version.outputs.display }}
    steps:
      - name: Check out source
        uses: actions/checkout@v7

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache-dependency-path: go.sum

      - name: Install build and packaging dependencies
        run: |
          sudo apt-get update
          sudo apt-get install --yes \
            gcc libc6-dev libgl1-mesa-dev libxcursor-dev libxi-dev \
            libxinerama-dev libxrandr-dev libxxf86vm-dev libasound2-dev \
            pkg-config imagemagick

      - name: Build application
        run: |
          mkdir -p dist/linux
          CGO_ENABLED=1 go build -trimpath -buildvcs=false \
            -ldflags "-s -w -X github.com/nicolaskrawec/PicaGo/internal/app.Version=$RELEASE_VERSION" \
            -o dist/linux/picago .

      - name: Build DEB package
        run: |
          package_root="dist/deb-root"
          install -Dm755 dist/linux/picago "$package_root/usr/bin/picago"
          install -Dm644 packaging/linux/picago.desktop \
            "$package_root/usr/share/applications/picago.desktop"
          mkdir -p "$package_root/usr/share/icons/hicolor/256x256/apps"
          convert 'internal/assets/icon.ico[0]' -resize 256x256 \
            "$package_root/usr/share/icons/hicolor/256x256/apps/picago.png"
          install -Dm644 packaging/linux/control "$package_root/DEBIAN/control"
          install -Dm644 THIRD_PARTY_NOTICES.txt \
            "$package_root/usr/share/doc/picago/THIRD_PARTY_NOTICES.txt"
          sed -i "s/@VERSION@/$RELEASE_VERSION/" "$package_root/DEBIAN/control"
          mkdir -p dist/release
          dpkg-deb --build --root-owner-group "$package_root" \
            "dist/release/picago_${RELEASE_VERSION}_amd64.deb"

      - name: Upload Debian package
        uses: actions/upload-artifact@v7
        with:
          name: release-linux-amd64
          path: dist/release/*.deb
          if-no-files-found: error

  macos:
    name: macOS ${{ matrix.arch }}
    needs: [version, test]
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-15-intel
            arch: amd64
          - runner: macos-15
            arch: arm64
    runs-on: ${{ matrix.runner }}
    env:
      RELEASE_VERSION: ${{ needs.version.outputs.display }}
      WINDOWS_VERSION: ${{ needs.version.outputs.windows }}
    steps:
      - name: Check out source
        uses: actions/checkout@v7

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache-dependency-path: go.sum

      - name: Build application bundle
        shell: bash
        run: |
          app="dist/dmg-root/PicaGo.app"
          mkdir -p "$app/Contents/MacOS" "$app/Contents/Resources"
          CGO_ENABLED=1 GOARCH=${{ matrix.arch }} go build -trimpath -buildvcs=false \
            -ldflags "-s -w -X github.com/nicolaskrawec/PicaGo/internal/app.Version=$RELEASE_VERSION" \
            -o "$app/Contents/MacOS/PicaGo" .
          cp packaging/macos/Info.plist "$app/Contents/Info.plist"
          cp THIRD_PARTY_NOTICES.txt "$app/Contents/Resources/THIRD_PARTY_NOTICES.txt"
          /usr/libexec/PlistBuddy -c \
            "Set :CFBundleShortVersionString $RELEASE_VERSION" "$app/Contents/Info.plist"
          bundle_version="${WINDOWS_VERSION%.*}"
          /usr/libexec/PlistBuddy -c \
            "Set :CFBundleVersion $bundle_version" "$app/Contents/Info.plist"
          codesign --force --deep --sign - "$app"

      - name: Build DMG
        shell: bash
        run: |
          ln -s /Applications dist/dmg-root/Applications
          mkdir -p dist/release
          hdiutil create \
            -volname "PicaGo $RELEASE_VERSION" \
            -srcfolder dist/dmg-root \
            -format UDZO \
            "dist/release/PicaGo-$RELEASE_VERSION-macos-${{ matrix.arch }}.dmg"

      - name: Upload macOS package
        uses: actions/upload-artifact@v7
        with:
          name: release-macos-${{ matrix.arch }}
          path: dist/release/*.dmg
          if-no-files-found: error

  release:
    name: Publish GitHub Release
    needs: [version, windows, linux, macos]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - name: Download packages
        uses: actions/download-artifact@v7
        with:
          pattern: release-*
          path: dist/release
          merge-multiple: true

      - name: Create or update GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          if gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            gh release upload "$RELEASE_TAG" dist/release/* --clobber
          else
            gh release create "$RELEASE_TAG" dist/release/* \
              --verify-tag --generate-notes --title "PicaGo ${{ needs.version.outputs.display }}"
          fi
